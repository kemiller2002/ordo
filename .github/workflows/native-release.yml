name: Native Ordo release

on:
  pull_request:
    paths:
      - ".github/workflows/native-release.yml"
      - "scripts/install-native.sh"
      - "scripts/install-native.ps1"
      - "release/**"
      - "src/**"
      - "distribution/**"
      - "release/**"
  push:
    branches: [main]
    paths:
      - "distribution/package.json"
      - ".github/workflows/native-release.yml"
      - "scripts/install-native.sh"
      - "scripts/install-native.ps1"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ordo-native-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build execution payload and native runtimes
        working-directory: distribution
        run: npm run build

      - name: Build native release bundles
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./distribution/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          rm -rf dist/native dist/native-stage
          mkdir -p dist/native dist/native-stage

          make_posix_bundle() {
            rid="$1"
            name="ordo-${rid}"
            root="dist/native-stage/${name}"
            mkdir -p "${root}/dist"
            cp -R distribution/dist/. "${root}/dist/"
            cp "distribution/runtimes/${rid}/sde" "${root}/ordo"
            chmod +x "${root}/ordo"
            printf '%s\n' "${VERSION}" > "${root}/VERSION"
            tar -czf "dist/native/${name}.tar.gz" -C dist/native-stage "${name}"
          }

          make_posix_bundle linux-x64
          make_posix_bundle linux-musl-x64
          make_posix_bundle linux-arm64
          make_posix_bundle osx-x64
          make_posix_bundle osx-arm64

          win_root="dist/native-stage/ordo-win-x64"
          mkdir -p "${win_root}/dist"
          cp -R distribution/dist/. "${win_root}/dist/"
          cp distribution/runtimes/win-x64/sde.exe "${win_root}/ordo.exe"
          printf '%s\n' "${VERSION}" > "${win_root}/VERSION"
          (cd dist/native-stage && zip -qr "../native/ordo-win-x64.zip" ordo-win-x64)

          (cd dist/native && sha256sum ordo-* > native-checksums.txt)
          cat dist/native/native-checksums.txt

      - name: Smoke test native installer and installed Ordo
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./distribution/package.json').version")"
          install_root="$(mktemp -d)"
          project_root="$(mktemp -d)"
          trap 'rm -rf "$install_root" "$project_root"' EXIT

          ECHELON_RELEASE_BASE_URL="file://$PWD/dist/native"             sh scripts/install-native.sh --version "$VERSION" --install-base "$install_root"

          "$install_root/bin/ordo" --version
          "$install_root/bin/sde" --version
          (
            cd "$project_root"
            "$install_root/bin/ordo" init
            "$install_root/bin/ordo" verify
          )
          sh -n scripts/install-native.sh

      - name: Generate shared Echelon release manifest
        uses: kemiller2002/echelon-registry/actions/release-contract@73d1e87fe40c703eb1cd5e7cf7caf9d852f788b9
        with:
          release-input: release/echelon.release-input.json
          artifact-dir: dist/native
          output: dist/native/echelon-release.json
          version: ${{ steps.bundle.outputs.version }}
          tag: v${{ steps.bundle.outputs.version }}
          commit: ${{ github.sha }}
          release-stage: stable

      - name: Inspect generated release manifest
        run: python3 -m json.tool dist/native/echelon-release.json

      # A published version's assets are immutable: consumers pin a version
      # and verify its digest. Pushes that do not bump the version publish
      # nothing rather than replacing an existing release's assets.
      - name: Decide whether this version still needs publishing
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(mktemp -d)"
          if gh release download "v${VERSION}" --pattern native-checksums.txt --dir "$existing" >/dev/null 2>&1; then
            if cmp -s "$existing/native-checksums.txt" dist/native/native-checksums.txt; then
              echo "v${VERSION} already publishes these exact native assets."
            else
              echo "::warning::v${VERSION} already publishes different native assets. Released versions are immutable; bump the version to publish a new build. Nothing was uploaded."
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest native release provenance
        if: github.event_name != 'pull_request' && steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/native/ordo-*
            dist/native/native-checksums.txt
            dist/native/echelon-release.json

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/native/ordo-* dist/native/native-checksums.txt dist/native/echelon-release.json)
          # Uploads never overwrite: an asset that already exists is never replaced.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "${assets[@]}"
          else
            gh release create "v${VERSION}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Ordo v${VERSION}" \
              --notes "Native Ordo/SDE bundles. These bundles require no Node.js or .NET runtime on the consuming machine."
          fi

      - name: Smoke-test the published release asset
        if: github.event_name != 'pull_request' && steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          gh release download "v${VERSION}" --pattern ordo-linux-x64.tar.gz --pattern native-checksums.txt --dir "$check"
          (cd "$check" && grep ' ordo-linux-x64.tar.gz$' native-checksums.txt | sha256sum -c -)
          tar -xzf "$check/ordo-linux-x64.tar.gz" -C "$check"
          test "$("$check/ordo-linux-x64/ordo" --version)" = "${VERSION}"


  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @("scripts/install-native.ps1")
          foreach ($file in $files) {
            [scriptblock]::Create((Get-Content -Raw $file)) | Out-Null
            Write-Host "parsed $file"
          }
