# Operator release entry point:
#
#   gh workflow run release.yml -f bump=patch     (or minor | major | X.Y.Z)
#
# Resolves the next version (failing closed if it is not newer or is already
# tagged or released), runs the full F# suite, Praxis validation and package
# checks, then bumps the single authoritative version
# (distribution/package.json) together with this repository's own
# .echelon/toolchain.json ordo pin as an attributed Praxis work item
# (scripts/ordo-release-bump.sh) and dispatches the native release
# (native-release.yml, which tags and publishes from main in its own run) and
# the npm compatibility publish (publish.yml, gated by NPM_PUBLISH_ENABLED).
# A push made with GITHUB_TOKEN starts no workflow, so both are dispatched.
name: Release (operator)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major | X.Y.Z"
        required: true
        default: patch
      dry_run:
        description: "Validate and report the version without committing, tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ordo-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kemiller2002/ordo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use the GitHub Actions bot as the Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Fails closed before anything is mutated: the next version must be
      # newer and must have neither a tag nor a release.
      - name: Resolve the next version
        id: next
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ordo-release-bump.sh "$BUMP" --dry-run | tee -a "$GITHUB_OUTPUT"
      - name: Full F# suite
        run: |
          (cd distribution && npm run build:payload)
          dotnet test tests/Ordo.Tests/Ordo.Tests.fsproj --nologo
          dotnet test tests/Sde.Core.Tests/Sde.Core.Tests.fsproj --nologo
          dotnet test tests/Ordo.Complexity.Tests/Ordo.Complexity.Tests.fsproj --nologo
          dotnet test tests/Ordo.Churn.Tests/Ordo.Churn.Tests.fsproj --nologo
      - name: Praxis validation
        run: |
          ./praxis registry check
          ./praxis validate
      - name: Package contents
        working-directory: distribution
        run: |
          npm run build
          npm run test:package
          npm pack --dry-run
      # The bump is an attributed Praxis work item under the GitHub Actions
      # identity: begin, bump distribution/package.json and this repository's
      # own .echelon/toolchain.json ordo pin, commit, push, checkpoint,
      # complete, push the Praxis state. native-release.yml creates the tag
      # with the release, from main, in its own run.
      - name: Bump the version as an attributed work item
        id: bump
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          BUMP: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ordo-release-bump.sh "$BUMP" | tee -a "$GITHUB_OUTPUT"
      - name: Dispatch native release and npm compatibility publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.bump.outputs.base }}
        run: |
          [ -n "$BASE" ] || { echo "::error::the bump reported no base commit"; exit 1; }
          gh workflow run native-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
