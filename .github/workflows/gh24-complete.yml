name: GH-24 ROS completion

on:
  push:
    branches:
      - work/gh-24-negative-knowledge

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[gh24-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-24 through ROS
        run: |
          ./ros work context GH-24
          ./ros work complete GH-24 --actor ChatGPT --conclusion implemented \
            --evidence research-record=research/experiments/EX-SDE-2026-0007--negative-knowledge-representation-spike.md \
            --evidence decision-record=research/decisions/DF-SDE-2026-0015--represent-negative-search-observations-as-typed-evidence-content.md \
            --evidence implementation=src/Ordo.Core/NegativeKnowledge.fs \
            --evidence implementation=src/Ordo.Core/Wire.fs \
            --evidence tests=tests/Ordo.Tests/CoreTests.fs \
            --evidence tests=tests/Ordo.Tests/WireTests.fs
          ./ros validate
      - name: Commit ROS-generated completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh24-complete.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: complete GH-24 under ROS [gh24-complete]"
          git push
