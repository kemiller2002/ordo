name: GH-21 ROS completion

on:
  push:
    branches:
      - work/gh-21-derived-evidence-closure

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[gh21-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-21 through ROS
        run: |
          ./ros work context GH-21
          ./ros work complete GH-21 --actor ChatGPT --conclusion implemented \
            --evidence implementation=src/Ordo.Core/Evidence.fs \
            --evidence implementation=src/Ordo.Decisions/Request.fs \
            --evidence tests=tests/Ordo.Tests/CoreTests.fs \
            --evidence tests=tests/Ordo.Tests/DecisionTests.fs
          ./ros validate
      - name: Commit ROS-generated completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh21-complete.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: complete GH-21 under ROS [gh21-complete]"
          git push
