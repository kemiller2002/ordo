name: Publish @echelon-foundry/sde to npm

# Publishes distribution/ to npm whenever its package.json version changes on
# a push to the release branch. Uses npm's Trusted Publishing (OIDC) — no
# NPM_TOKEN secret is stored in this repository. Authentication is short-lived
# and issued per run via the `id-token: write` permission below, exchanged
# automatically by npm CLI >= 11.5.1 for a publish token, provided the
# package's "Trusted Publisher" settings on npmjs.com name this exact
# repository and this exact workflow file (.github/workflows/publish.yml).
#
# PREREQUISITE, one-time, done outside this workflow: npm requires a package
# to already exist before Trusted Publishing can be configured for it. The
# very first publish of @echelon-foundry/sde had to be done manually
# (`npm login` + `npm publish --access public`). After that one manual
# publish and the Trusted Publisher configuration, every subsequent version
# bump merged here publishes automatically.
#
# Nothing is published until the full validation chain has passed: F# unit
# tests, all six platform executables built, the package contents reviewed,
# and the real packed tarball exercised on Linux, Windows and macOS. A local
# developer machine is never the authoritative release process.

on:
  push:
    branches:
      # Both names are listed on purpose. This trigger is the only thing tying
      # releases to a branch name, so renaming the default branch with a single
      # name here would stop publishing silently — the workflow would simply
      # never fire again, with nothing failing to say so. Whichever name is
      # current, a push to it still publishes. Drop the old name once the
      # rename has happened and one release has gone out from `main`.
      - main
      - claude/ros-bootstrap-init-ao9vu4
    paths:
      - "distribution/package.json"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the execution package
        run: npm run build:payload
        working-directory: distribution

      - name: Run the F# test suite
        run: dotnet test tests/Sde.Core.Tests/Sde.Core.Tests.fsproj --nologo

      - name: Build this platform's executable
        run: npm run build:runtimes
        working-directory: distribution

      - name: Exercise the real packed tarball
        run: npm run test:package
        working-directory: distribution

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm CLI >= 11.5.1; Node 22's bundled npm may
      # be older, so pin an npm known to support it rather than trusting
      # whatever ships with the runner's Node version.
      - run: npm install -g npm@^11.5.1

      - name: Build payload and every platform executable
        run: npm run build

      - name: Re-run the packed-artifact checks on the exact release build
        run: npm run test:package

      - name: Review what is about to be published
        run: npm pack --dry-run

      - name: Determine whether the package version changed
        id: version-check
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view @echelon-foundry/sde version 2>/dev/null || echo "")"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --access public

      - name: Skip (version unchanged)
        if: steps.version-check.outputs.changed == 'false'
        run: |
          echo "package.json version (${{ steps.version-check.outputs.local }}) matches the version already on npm; nothing to publish."
