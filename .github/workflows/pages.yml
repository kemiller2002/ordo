name: Ordo site

# Builds and publishes the Ordo website (site/) to GitHub Pages.
#
# The generator validates the whole site in memory before writing anything, so
# a failed check fails this job before the Pages artifact is uploaded. There is
# no path by which a site with a broken citation, an unresolvable internal
# link, an unsourced metric or an unparseable data file reaches the deployment
# step: `ordo-site build` exits non-zero and the job stops.

on:
  push:
    branches:
      - main
    paths:
      - "tests/ui-conformance/**"
      - "site/**"
      - "src/Ordo.Site/**"
      - "src/Sde.Core/**"
      - "tests/Ordo.Site.Tests/**"
      - "Directory.Build.props"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "tests/ui-conformance/**"
      - "site/**"
      - "src/Ordo.Site/**"
      - "src/Sde.Core/**"
      - "tests/Ordo.Site.Tests/**"
      - "Directory.Build.props"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# An older run must never overwrite a newer deployment. Cancelling in progress
# is safe here because the artifact is rebuilt deterministically from the
# repository on every run; nothing is lost by abandoning a superseded build.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build and validate the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The test suite runs before the site is generated, not after. It covers
      # the evidence-manifest parser's refusals, front-matter and token
      # handling, every validation rule, and an integration pass over the real
      # site/ tree including a byte-for-byte determinism check.
      - name: Run the site test suite
        run: dotnet test tests/Ordo.Site.Tests/Ordo.Site.Tests.fsproj --nologo

      - name: Generate the site
        run: dotnet run --project src/Ordo.Site -- build --site site --out dist

      # `build` already validated before writing. Running `validate` again over
      # the same sources is cheap and makes the gate explicit in the log rather
      # than implicit in the build step's exit code.
      - name: Re-check the generated site
        run: dotnet run --project src/Ordo.Site -- validate --site site

      # Written to the log as well as the job summary. A measurement only a
      # human can see by clicking into a summary page is not one anybody
      # checks, and this site's own argument is about checkable numbers.
      # Every figure here is measured from dist/. Naming a specific page would be
      # a path copied out of site/content/ with nothing checking the copy still
      # resolves — the rename to /how-it-works/ left this step stat-ing a page
      # that no longer existed, and the error was swallowed by the pipeline.
      - name: Report payload size
        run: |
          set -o pipefail
          sizes=$(find dist -name '*.html' -printf '%s\n' | sort -n)
          pages=$(printf '%s\n' "$sizes" | wc -l)
          median=$(printf '%s\n' "$sizes" | awk -v n="$pages" 'NR == int((n + 1) / 2)')
          # awk rather than head: head exits early, which can SIGPIPE sort, and
          # pipefail would then fail the step for a reason that is not a defect.
          largest=$(find dist -name '*.html' -printf '%s %p\n' | sort -rn | awk 'NR == 1')
          css=$(find dist -name '*.css' -exec cat {} + | wc -c)
          {
            echo "### Ordo site payload"
            echo '```'
            echo "total on disk:  $(du -sh dist | cut -f1)"
            echo "files:          $(find dist -type f | wc -l)"
            echo "html:           $pages pages, $(find dist -name '*.html' -exec cat {} + | wc -c) bytes uncompressed"
            echo "css:            $css bytes"
            echo "javascript:     $(find dist -name '*.js' | wc -l) files"
            echo "largest page:   $largest"
            echo "median page:    $median bytes + $css bytes of CSS"
            echo "requests/page:  1 html + 1 css + 1 favicon, plus 2 to Google Fonts"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ordo-site
          path: dist
          retention-days: 7

  # visual-engineering/UI-LAYOUT-INTERACTION@1.0.0 conformance (issue #76).
  # Blocking: deploy needs it. Any failing test, schema-invalid evidence or
  # failing surface/action fails the job. Evidence, results and traces are
  # uploaded whatever the outcome.
  ui-conformance:
    name: UI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ui-conformance/package-lock.json

      - name: Install the conformance suite
        working-directory: tests/ui-conformance
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests/ui-conformance
        run: npx playwright install --with-deps chromium

      - name: Run UI conformance
        working-directory: tests/ui-conformance
        run: npm run ui:conformance
        env:
          UI_CONFORMANCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          UI_CONFORMANCE_WORKERS: "4"

      - name: Upload evidence, results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance
          path: tests/ui-conformance/test-results/
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build and validate but never deploy: a proposed change is
    # checked, not published.
    if: github.event_name != 'pull_request'
    needs: [build, ui-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Rebuilt rather than downloaded from the build job: the generator is
      # deterministic (asserted by the test suite), so a rebuild from the same
      # commit produces byte-identical output, and this keeps the artifact that
      # deploys traceable to a checkout rather than to an inter-job transfer.
      - name: Generate the site
        run: dotnet run --project src/Ordo.Site -- build --site site --out dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
