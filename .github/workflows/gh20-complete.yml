name: GH-20 ROS completion

on:
  push:
    branches:
      - work/gh-20-versioned-state-views

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[gh20-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-20 through ROS
        run: |
          ./ros work context GH-20
          ./ros work complete GH-20 --actor ChatGPT --conclusion implemented \
            --evidence implementation=src/Ordo.Core/StateIdentity.fs \
            --evidence implementation=src/Ordo.Core/Wire.fs \
            --evidence implementation=src/Ordo.Decisions/Request.fs \
            --evidence implementation=src/Ordo.Core/Transition.fs \
            --evidence tests=tests/Ordo.Tests/CoreTests.fs \
            --evidence tests=tests/Ordo.Tests/WireTests.fs
          ./ros validate
      - name: Commit ROS-generated completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh20-complete.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: complete GH-20 under ROS [gh20-complete]"
          git push
