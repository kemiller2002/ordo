name: ROS validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./ros registry check
      - run: ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      # A research record is only as good as the tool that produced its
      # numbers. EV-SDE-2026-0008 cites per-run complexity figures; these tests
      # hand-count every rule the measure applies, including the two cases
      # where it is knowingly wrong, so a silent change to the measure cannot
      # reach a published figure unnoticed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/Ordo.Complexity.Tests/Ordo.Complexity.Tests.fsproj --nologo
      # EX-SDE-2026-0003's rework figures come from this tool, and it replaces
      # hand-classified numbers that cannot be audited. Two defects in it were
      # found by running it against real history; these tests pin both.
      - run: dotnet test tests/Ordo.Churn.Tests/Ordo.Churn.Tests.fsproj --nologo
