name: GH-18 ROS completion

on:
  push:
    branches:
      - work/gh-18-ordo-next-pass

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[gh18-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-18 through ROS
        run: |
          ./ros work context GH-18
          ./ros work complete GH-18 --actor ChatGPT --conclusion accepted --evidence research-record=research/journals/JR-SDE-2026-0005--ordo-next-pass-requirements-governance.md
          ./ros validate
      - name: Commit ROS-generated completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh18-complete.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: complete GH-18 under ROS [gh18-complete]"
          git push
