name: GH-23 ROS completion

on:
  push:
    branches:
      - work/gh-23-unknown-effects-capability

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[gh23-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-23 through ROS
        run: |
          ./ros work context GH-23
          ./ros work complete GH-23 --actor ChatGPT --conclusion implemented \
            --evidence implementation=src/Ordo.Core/ExternalEffect.fs \
            --evidence implementation=src/Ordo.Core/Obligation.fs \
            --evidence implementation=src/Ordo.Core/Capability.fs \
            --evidence implementation=src/Ordo.Core/Wire.fs \
            --evidence tests=tests/Ordo.Tests/CoreTests.fs \
            --evidence tests=tests/Ordo.Tests/WireTests.fs
          ./ros validate
      - name: Commit ROS-generated completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh23-complete.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: complete GH-23 under ROS [gh23-complete]"
          git push
