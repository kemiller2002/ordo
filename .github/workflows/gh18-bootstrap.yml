name: GH-18 ROS bootstrap

on:
  push:
    branches:
      - work/gh-18-ordo-next-pass

permissions:
  contents: write

jobs:
  start-work:
    if: ${{ !contains(github.event.head_commit.message, '[gh18-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start GH-18 through the repository ROS CLI
        run: |
          ./ros work begin GH-18 --type research --actor ChatGPT
          ./ros work context GH-18

      - name: Commit the ROS-generated state and remove this temporary bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh18-bootstrap.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: start GH-18 under ROS [gh18-bootstrap-complete]"
          git push
