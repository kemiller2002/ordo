name: GH-24 registry refresh

on:
  push:
    branches:
      - work/gh-24-negative-knowledge

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[gh24-indexed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild registries and validate GH-24 records
        run: |
          ./ros work context GH-24
          ./ros registry build
          ./ros registry check
          ./ros validate
      - name: Commit generated registries and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh24-registry.yml
          git add registries
          git commit -m "research: index GH-24 negative-knowledge decision [gh24-indexed]"
          git push
