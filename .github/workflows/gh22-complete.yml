name: GH-22 ROS completion

on:
  push:
    branches:
      - work/gh-22-scoped-coverage

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[gh22-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-22 through ROS
        run: |
          ./ros work context GH-22
          ./ros work complete GH-22 --actor ChatGPT --conclusion implemented \
            --evidence research-record=research/experiments/EX-SDE-2026-0006--scoped-coverage-representation-spike.md \
            --evidence decision-record=research/decisions/DF-SDE-2026-0014--represent-context-coverage-as-first-class-claims.md \
            --evidence implementation=src/Ordo.Core/Coverage.fs \
            --evidence implementation=src/Ordo.Decisions/Contract.fs \
            --evidence implementation=src/Ordo.Decisions/Request.fs \
            --evidence implementation=src/Ordo.Decisions/Resolve.fs \
            --evidence tests=tests/Ordo.Tests/CoreTests.fs \
            --evidence tests=tests/Ordo.Tests/SliceTests.fs
          ./ros validate
      - name: Commit ROS-generated completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh22-complete.yml
          git add .ros/context/current.json .ros/events/events.jsonl
          git commit -m "chore: complete GH-22 under ROS [gh22-complete]"
          git push
